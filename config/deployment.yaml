apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsm-credential-provider
  namespace: ate-system
  labels:
    app: gsm-credential-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gsm-credential-provider
  template:
    metadata:
      labels:
        app: gsm-credential-provider
    spec:
      serviceAccountName: gsm-credential-provider
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: gsm-credential-provider
        image: ko://github.com/LiorLieberman/substrate-gcp-secrets-manager-plugin/cmd/gsm-credential-provider
        args:
        - "--listen-address=:50051"
        - "--health-address=:9090"
        # Serve with a substrate servicedns certificate, whose SAN is this
        # Service's DNS name (gsm-credential-provider.ate-system.svc),
        # the name substrate's egress gateway pins when it dials the provider.
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        # Admit only a client certificate that chains to substrate's podidentity
        # trust bundle and carries the egress gateway's SPIFFE ID
        # (--injector-identity, default
        # spiffe://cluster.local/ns/ate-system/sa/atenet-egress).
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        - "--log-level=info"
        ports:
        - name: grpc
          containerPort: 50051
        - name: health
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      # The serving certificate, issued by substrate's pod certificate
      # controller for the Services that select this pod.
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      # The CA the egress gateway's client certificate chains to.
      - name: podidentity
        projected:
          sources:
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
